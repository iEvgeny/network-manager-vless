name: Release

on:
  # Publish once the release is actually published. The CI workflow is limited
  # to branch pushes, so pushing a tag does not start a duplicate full test run.
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deb:
    name: Ubuntu ${{ matrix.ubuntu }} · ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - ubuntu: "24.04"
            runner: ubuntu-24.04
            arch: amd64
            plasma_qt_version: "5"
          - ubuntu: "24.04"
            runner: ubuntu-24.04-arm
            arch: arm64
            plasma_qt_version: "5"
          - ubuntu: "26.04"
            runner: ubuntu-26.04
            arch: amd64
            plasma_qt_version: "6"
    runs-on: ${{ matrix.runner }}
    env:
      PLASMA_QT_VERSION: ${{ matrix.plasma_qt_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get build-dep -y .
          if [ "$PLASMA_QT_VERSION" = "6" ]; then
            sudo apt-get install --no-install-recommends -y \
              qt6-base-dev \
              libkf6coreaddons-dev \
              libkf6i18n-dev \
              libkf6networkmanagerqt-dev \
              libkf6widgetsaddons-dev
          fi

      - name: Check that the tag matches the upstream package version
        run: |
          package_version=$(dpkg-parsechangelog --show-field Version)
          upstream_version=${package_version%-*}
          test "v$upstream_version" = "$GITHUB_REF_NAME"

      - name: Build the package
        run: build-aux/build-deb.sh

      - name: Add the Ubuntu version to package filenames
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          for package in dist/*.deb; do
            mv "$package" "${package%.deb}_ubuntu-${UBUNTU_VERSION}.deb"
          done
          ls -1 dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: network-manager-vless-deb-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach Ubuntu-specific packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          build-aux/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum *.deb > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "NetworkManager-vless $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "NetworkManager-vless $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber *.deb SHA256SUMS
