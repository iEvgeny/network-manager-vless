name: Release

on:
  # Wait until a release is published, then build each released Ubuntu LTS target once.
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deb:
    name: Ubuntu ${{ matrix.ubuntu }} ${{ matrix.codename }} · ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - ubuntu: "22.04"
            codename: jammy
            runner: ubuntu-22.04
            arch: amd64
            plasma_qt_version: "5"
          - ubuntu: "22.04"
            codename: jammy
            runner: ubuntu-22.04-arm
            arch: arm64
            plasma_qt_version: "5"
          - ubuntu: "24.04"
            codename: noble
            runner: ubuntu-24.04
            arch: amd64
            plasma_qt_version: "5"
          - ubuntu: "24.04"
            codename: noble
            runner: ubuntu-24.04-arm
            arch: arm64
            plasma_qt_version: "5"
          - ubuntu: "26.04"
            codename: resolute
            runner: ubuntu-26.04
            arch: amd64
            plasma_qt_version: "6"
          - ubuntu: "26.04"
            codename: resolute
            runner: ubuntu-26.04-arm
            arch: arm64
            plasma_qt_version: "6"
    runs-on: ${{ matrix.runner }}
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      UBUNTU_CODENAME: ${{ matrix.codename }}
      PLASMA_QT_VERSION: ${{ matrix.plasma_qt_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: build-aux/install-build-deps.sh "$UBUNTU_VERSION"

      - name: Check that the tag matches the upstream package version
        run: |
          package_version=$(dpkg-parsechangelog --show-field Version)
          upstream_version=${package_version%-*}
          test "v$upstream_version" = "$GITHUB_REF_NAME"

      - name: Build the package
        run: |
          if [ "$UBUNTU_VERSION" = "22.04" ]; then
            build-aux/build-deb.sh -d
          else
            build-aux/build-deb.sh
          fi

      - name: Add Ubuntu release to package filenames
        run: build-aux/label-deb-assets.sh "$UBUNTU_VERSION" "$UBUNTU_CODENAME"

      - uses: actions/upload-artifact@v4
        with:
          name: network-manager-vless-deb-ubuntu-${{ matrix.ubuntu }}-${{ matrix.codename }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach Ubuntu-specific packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          build-aux/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum *.deb > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "NetworkManager-vless $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "NetworkManager-vless $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber *.deb SHA256SUMS
