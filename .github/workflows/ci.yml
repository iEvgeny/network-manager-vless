name: CI

on:
  # Tag pushes are handled by the release workflow; avoid running the full CI
  # suite a second time for the same release.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            codename: jammy
            runner: ubuntu-22.04
          - ubuntu: "24.04"
            codename: noble
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      UBUNTU_CODENAME: ${{ matrix.codename }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          build-aux/install-build-deps.sh "$UBUNTU_VERSION"
          sudo apt-get install --no-install-recommends -y python3-venv libgtk-4-bin dbus

      - name: Lint and type check
        run: make lint typecheck

      - name: Build
        shell: bash
        run: |
          set +e
          (
            .venv/bin/meson setup build --prefix=/usr -Deditor=enabled -Dplasma_editor=enabled || exit $?
            .venv/bin/meson compile -C build || exit $?
          ) >"$RUNNER_TEMP/meson-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/meson-build.log"
          if [ "$status" -ne 0 ]; then
            failure=$(tail -n 30 "$RUNNER_TEMP/meson-build.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Build failed::$failure"
            exit "$status"
          fi

      - name: Test (editor on a headless Broadway display, pinned Xray-core)
        shell: bash
        run: |
          set -e
          build-aux/fetch-xray.sh amd64 "$RUNNER_TEMP/xray"
          gtk4-broadwayd :5 &
          set +e
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 \
          NM_VLESS_TEST_XRAY="$RUNNER_TEMP/xray/xray" \
          NM_VLESS_BUILD_DIR="$PWD/build" \
            .venv/bin/pytest -ra >"$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          if [ "$status" -ne 0 ]; then
            failure=$(tail -n 30 "$RUNNER_TEMP/pytest.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Tests failed::$failure"
            exit "$status"
          fi

      - name: Staged install
        run: |
          .venv/bin/meson install -C build --destdir "$PWD/stage"
          test -x stage/usr/libexec/nm-vless-service
          grep -q '^\[libnm\]' stage/usr/lib/NetworkManager/VPN/nm-vless-service.name
          plugin=$(find stage/usr/lib -path '*/qt5/plugins/plasma/network/vpn/libplasmanetworkmanagement_vlessui_qt5.so' -print -quit)
          test -n "$plugin"
          readelf -d "$plugin" | grep -q 'NEEDED.*libplasmanm_editor\.so'
          ldd -r "$plugin" > "$RUNNER_TEMP/plasma5-plugin-ldd.log" 2>&1 || {
            cat "$RUNNER_TEMP/plasma5-plugin-ldd.log"
            exit 1
          }
          if grep -Eq 'not found|undefined symbol' "$RUNNER_TEMP/plasma5-plugin-ldd.log"; then
            cat "$RUNNER_TEMP/plasma5-plugin-ldd.log"
            exit 1
          fi

      - name: Build Debian packages for download
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$UBUNTU_VERSION" = "22.04" ]; then
            build-aux/build-deb.sh -d
          else
            build-aux/build-deb.sh
          fi

      - name: Add Ubuntu version to package filenames
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        run: build-aux/label-deb-assets.sh "$UBUNTU_VERSION" "$UBUNTU_CODENAME"

      - name: Check Debian package split and Plasma 5 plugin
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        run: |
          core=$(find dist -maxdepth 1 -name 'network-manager-vless_*.deb' -print -quit)
          gnome=$(find dist -maxdepth 1 -name 'network-manager-vless-gnome_*.deb' -print -quit)
          kde=$(find dist -maxdepth 1 -name 'network-manager-vless-kde_*.deb' -print -quit)
          test -n "$core" && test -n "$gnome" && test -n "$kde"
          dpkg-deb --contents "$core" | grep -q 'NetworkManager/libnm-vpn-plugin-vless.so$'
          ! dpkg-deb --contents "$core" | grep -q 'libnm-gtk4-vpn-plugin-vless-editor.so'
          ! dpkg-deb --contents "$core" | grep -q 'nm-vless-proxy-guard.service'
          dpkg-deb --contents "$gnome" | grep -q 'libnm-gtk4-vpn-plugin-vless-editor.so$'
          dpkg-deb --contents "$gnome" | grep -q 'nm-vless-proxy-guard.service$'
          dpkg-deb --contents "$kde" | grep -q 'qt5/plugins/plasma/network/vpn/libplasmanetworkmanagement_vlessui_qt5.so$'

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        with:
          name: network-manager-vless-deb-ubuntu-${{ matrix.ubuntu }}-${{ matrix.codename }}-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  package-26-04:
    name: Package for Ubuntu 26.04 (Resolute, Plasma 6)
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    env:
      UBUNTU_VERSION: "26.04"
      UBUNTU_CODENAME: resolute
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: build-aux/install-build-deps.sh "$UBUNTU_VERSION"

      - name: Build Debian packages
        shell: bash
        run: |
          set +e
          PLASMA_QT_VERSION=6 build-aux/build-deb.sh >"$RUNNER_TEMP/package-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/package-build.log"
          if [ "$status" -ne 0 ]; then
            failure=$(tail -n 24 "$RUNNER_TEMP/package-build.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Ubuntu 26.04 package build failed::$failure"
            exit "$status"
          fi

      - name: Check Plasma 6 package contents
        run: |
          kde=$(find dist -maxdepth 1 -name 'network-manager-vless-kde_*.deb' -print -quit)
          test -n "$kde"
          dpkg-deb --contents "$kde" | grep -q 'qt6/plugins/plasma/network/vpn/libplasmanetworkmanagement_vlessui_qt6.so$'
          tmp=$(mktemp -d)
          dpkg-deb --extract "$kde" "$tmp"
          plugin=$(find "$tmp/usr/lib" -path '*/qt6/plugins/plasma/network/vpn/libplasmanetworkmanagement_vlessui_qt6.so' -print -quit)
          test -n "$plugin"
          readelf -d "$plugin" | grep -q 'NEEDED.*libplasmanm_editor\.so'
          ldd -r "$plugin" > "$RUNNER_TEMP/plasma6-plugin-ldd.log" 2>&1 || {
            cat "$RUNNER_TEMP/plasma6-plugin-ldd.log"
            exit 1
          }
          if grep -Eq 'not found|undefined symbol' "$RUNNER_TEMP/plasma6-plugin-ldd.log"; then
            cat "$RUNNER_TEMP/plasma6-plugin-ldd.log"
            exit 1
          fi

      - name: Add Ubuntu version to package filenames
        run: build-aux/label-deb-assets.sh "$UBUNTU_VERSION" "$UBUNTU_CODENAME"

      - uses: actions/upload-artifact@v4
        with:
          name: network-manager-vless-deb-ubuntu-26.04-resolute-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
